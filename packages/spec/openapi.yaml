openapi: 3.1.0
info:
  title: Bug Report API
  version: 3.0.0
  description: |
    The API contract every bug-report backend must honor. The widget
    (packages/widget) and the CLI (packages/cli) speak this protocol;
    backends implement it. A cross-stack Playwright suite (e2e/) drives
    every reference implementation against the same scenarios.

    Auth is intentionally undefined at the spec level — each consuming
    app gates access according to its own model (admin email allowlist,
    SSO group, Tailscale host, whatever). The spec defines *behaviour*,
    not *who can do what*.

servers:
  - url: /api
    description: Mounted relative to the consuming app's API root.

paths:
  /bugs:
    post:
      summary: File a new bug report
      description: |
        Accepts a JSON body or multipart/form-data. `details` is required.
        Servers MUST stamp `addedAt` (UTC ISO-8601) and assign an `id`.
      operationId: createBug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BugCreate"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BugCreate"
      responses:
        "201":
          description: Bug filed
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    example: bug-20260516-181523-a3b91f2
                  app:
                    type: string
                    nullable: true
                    description: |
                      The app the report was filed under (backends 3.0.0): stamped
                      from the caller's identity, never from the body. Null when
                      the server does not stamp one.
                  appIgnored:
                    type: string
                    description: |
                      Only when a trusted app's `X-Leap-App` header disagreed with
                      its token: the claim that was ignored. (`X-Leap-App-Used` /
                      `X-Leap-App-Ignored` response headers say the same.)
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: Body exceeds size limits (details or screenshot)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      summary: List bug reports (admin)
      operationId: listBugs
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/Status"
        - in: query
          name: days
          description: Filter to bugs filed within the last N days. Default 30.
          schema:
            type: integer
            minimum: 1
            default: 30
        - in: query
          name: app
          description: Only reports filed under this app (backends 3.0.0).
          schema: { type: string }
        - in: query
          name: kind
          description: Only this kind, stored or derived from the tags (3.0.0).
          schema:
            type: string
            enum: [bug, feature]
        - in: query
          name: area
          description: Only this area (3.0.0).
          schema: { type: string }
        - in: query
          name: priority
          description: Only this priority (3.0.0).
          schema:
            type: string
            enum: [now, next, later]
      responses:
        "200":
          description: A list of bugs sorted newest-first
          content:
            application/json:
              schema:
                type: object
                required: [bugs]
                properties:
                  bugs:
                    type: array
                    items:
                      $ref: "#/components/schemas/BugSummary"

  /bugs/{id}:
    parameters:
      - $ref: "#/components/parameters/BugId"

    get:
      summary: Fetch a single bug with audit history
      operationId: getBug
      responses:
        "200":
          description: Full bug record including audit trail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bug"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      summary: Transition status and/or set triage fields (admin)
      description: |
        Backends 3.0.0: `status` is optional when a triage field (`area`,
        `priority`, `owner`, `parentId`, `duplicateOf`) is sent. A null or
        empty value clears a field; a value equal to the current one is a
        no-op. Each change writes an audit row (from = to = the current
        status) whose `note` says what changed, e.g. `area: none -> Cutter`.
        `duplicateOf` also DECLINES the report, with the status row's note
        `duplicate of <id>` (409 when the lifecycle forbids declining, 400 when
        `status` is given and is not `declined`). `parentId` must not make a
        cycle. 404 when a referenced report does not exist.


        Implementations MUST write an audit row on every successful
        transition and MUST be no-op when status == current status.

        `notify` (backends 2.2.0, optional, default false) asks the server to
        email the reporter. It is acted on only when the status actually
        changes to `resolved` or `declined`; reopening never emails. It
        requires a non-empty `note` (else 400). The change and its audit row
        are written first; a failed send never undoes it. After the send a
        second audit row (from = to = the new status) records the outcome.
        The response carries `notified` when notify was requested. A server
        with no mailer (the Node backend) ignores `notify`.
      operationId: patchBug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: "#/components/schemas/Status"
                area:
                  type: string
                  nullable: true
                  maxLength: 100
                priority:
                  type: string
                  nullable: true
                  enum: [now, next, later]
                owner:
                  type: string
                  nullable: true
                  description: An email address.
                parentId:
                  type: string
                  nullable: true
                duplicateOf:
                  type: string
                  nullable: true
                note:
                  type: string
                  maxLength: 500
                changedBy:
                  type: string
                  description: Admin identity, when not derivable from auth.
                changedByName:
                  type: string
                  description: Display name for changedBy, when not derivable from auth.
                notify:
                  type: boolean
                  default: false
                  description: Email the reporter (see above). Needs `note`.
      responses:
        "200":
          description: Updated bug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bug"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /bugs/{id}/vote:
    parameters:
      - $ref: "#/components/parameters/BugId"
    post:
      summary: Vote for a report (any signed-in caller; backends 3.0.0)
      description: One vote per person; voting twice is a no-op. 401 when nobody is signed in.
      operationId: voteBug
      responses:
        "200":
          description: The report's vote count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Voted" }
        "401":
          description: Nobody is signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Take your vote back (backends 3.0.0)
      operationId: unvoteBug
      responses:
        "200":
          description: The report's vote count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Voted" }
        "401":
          description: Nobody is signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"

  /bugs/{id}/screenshot:
    parameters:
      - $ref: "#/components/parameters/BugId"
    get:
      summary: Download the captured screenshot
      operationId: getBugScreenshot
      responses:
        "200":
          description: |
            The stored screenshot's bytes (or 302 to a signed URL — server's
            choice). The media type describes what was actually stored, sniffed
            from the bytes: the widget serialises PNG when it fits under the
            size cap and falls back to JPEG when it does not, so a client must
            not assume PNG. Bytes in no recognised image format are served as
            image/png, which is what every server did before this was
            specified.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "302":
          description: Redirect to a short-TTL signed URL
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    BugId:
      in: path
      name: id
      required: true
      schema:
        type: string
        pattern: '^bug-\d{8}-\d{6}-[a-f0-9]{6}$'
        example: bug-20260516-181523-a3b91f2

  schemas:
    Status:
      type: string
      enum: [open, triaged, resolved, declined]

    BugCreate:
      type: object
      required: [details]
      properties:
        title:
          type: string
          maxLength: 100
          description: Optional. If absent, the first line of `details` is used.
        details:
          type: string
          maxLength: 10240
          description: Body of the report. 10 KB max.
        tags:
          oneOf:
            - type: array
              items: { type: string }
            - type: string
              description: Comma-separated when sent as form-encoded.
        addedBy:
          type: string
          description: 'web | agent | cli | ios:<device> | …'
          default: web
        actorEmail:
          type: string
          format: email
        actorName:
          type: string
          description: Display name of the person filing, when not derivable from auth.
        metaUrl:
          type: string
          format: uri
          maxLength: 500
        metaUserAgent:
          type: string
          maxLength: 300
        metaBuildSha:
          type: string
          maxLength: 40
        screenshot:
          type: string
          description: |
            data: URL or raw base64 PNG. Max 5 MB after decode. Optional;
            servers MUST accept a report without a screenshot.
        screenshotError:
          type: string
          maxLength: 200
          description: |
            Optional. Sent by widget 1.6.0+ when there is NO screenshot: why
            the capture failed, in words a person can read ("capture timed
            out after 6s"). Since 1.6.4 also sent WITH a screenshot when part
            of it may be missing ("1 embedded frame may be missing from the screenshot
            (…)"). Servers MAY store it with the report and MAY ignore
            it; the reference backends ignore it.
        clientKey:
          type: string
          maxLength: 64
          description: |
            Optional idempotency key, sent by widget 1.6.0+ when the app turns
            `idempotentSubmit` on: one per open report dialog, identical on
            every retry of that report. A server that honours it SHOULD
            answer a repeat of a key it has already stored with that
            report's existing `id` (200 or 201) instead of filing a second
            row; that is what makes "Submit again" safe after a request that
            was never answered. Servers MAY ignore it — the reference
            backends do, so an app on them must not enable `idempotentSubmit`
            unless its own server dedupes.
        kind:
          type: string
          enum: [bug, feature]
          description: Optional (backends 3.0.0). Stored; derived from `tags` when absent.
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptTurn"
          description: |
            Optional last-N chat turns for agent-filed reports. Names-only
            tool calls; no attachment bytes; no system prompt. See
            bug-report-pattern.md "Bundling the chat transcript".

    TranscriptTurn:
      type: object
      properties:
        ts:
          type: string
          format: date-time
        model:
          type: string
        userMessage:
          type: string
        assistantResponse:
          type: string
        toolCalls:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string

    BugSummary:
      type: object
      required: [id, title, tags, status, addedBy, addedAt, screenshot]
      properties:
        id: { type: string }
        title: { type: string }
        tags:
          type: array
          items: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        kind:
          type: string
          enum: [bug, feature]
          description: Stored since 3.0.0; derived from the tags (report-contract.json `kinds`, `kindTags`) when the filer did not say.
        addedBy: { type: string }
        actorEmail: { type: string }
        actorName:
          type: string
          description: Display name of whoever filed it ("" when unknown). Backends 2.2.0.
        addedAt: { type: string, format: date-time }
        screenshot:
          type: boolean
          description: True iff a screenshot was stored.
        app:
          type: string
          nullable: true
          enum: [stoppages, fleet, report, placements, sealviewer, leaphq]
          description: Stamped from the caller's identity (backends 3.0.0); null on a v2 record.
        product:
          type: string
          nullable: true
          enum: [PikPak, Seal, Placement, Internal]
          description: Derived from `app` by report-contract.json `appProducts`; not stored.
        area:
          type: string
          nullable: true
          description: Triage field (3.0.0).
        priority:
          type: string
          nullable: true
          enum: [now, next, later]
          description: Triage field (3.0.0).
        owner:
          type: string
          nullable: true
          description: Triage field (3.0.0), an email.
        parentId:
          type: string
          nullable: true
          description: Triage field (3.0.0), a report id.
        duplicateOf:
          type: string
          nullable: true
          description: Triage field (3.0.0), a report id; setting it declines the report.
        votes:
          type: integer
          minimum: 0
          description: Count of people who voted (3.0.0); 0 on a v2 record.

    Bug:
      allOf:
        - $ref: "#/components/schemas/BugSummary"
        - type: object
          required: [details, audit]
          properties:
            details: { type: string }
            metaUrl: { type: string }
            metaUserAgent: { type: string }
            metaBuildSha: { type: string }
            canNotify:
              type: boolean
              description: |
                GET /bugs/{id} only (backends 2.2.0). True when this server can
                email the reporter and the report has an `actorEmail`.
            notified:
              type: object
              description: PATCH response only, when `notify` was requested.
              required: [ok, to]
              properties:
                ok: { type: boolean }
                to: { type: string }
                error: { type: string }
            transcript:
              type: array
              items: { $ref: "#/components/schemas/TranscriptTurn" }
              nullable: true
            audit:
              type: array
              items: { $ref: "#/components/schemas/AuditEntry" }

    AuditEntry:
      type: object
      required: [changedAt, toStatus]
      properties:
        changedAt: { type: string, format: date-time }
        changedBy: { type: string }
        changedByName:
          type: string
          description: Display name of changedBy ("" when unknown). Backends 2.2.0.
        fromStatus:
          oneOf:
            - $ref: "#/components/schemas/Status"
            - type: "null"
        toStatus: { $ref: "#/components/schemas/Status" }
        note: { type: string }

    Voted:
      type: object
      required: [votes, voted]
      properties:
        votes: { type: integer, minimum: 0 }
        voted:
          type: boolean
          description: Whether the caller's vote now stands.

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

  responses:
    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No bug with this ID
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
